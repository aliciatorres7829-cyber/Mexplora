<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buscar Hoteles</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet" href="styles.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">

    <div class="container">

        <a class="navbar-brand fw-bold fs-3" href="index.html">
            MEXPLORA
        </a>

        <div class="navbar-nav mx-auto">

            <a class="nav-link" href="index.html">
                Inicio
            </a>

            <a class="nav-link active" href="hoteles.html">
                Buscar Hoteles
            </a>

            <a class="nav-link" href="experiencias.html">
                Experiencias
            </a>

            <a class="nav-link" href="estadisticas.html">
                Estadísticas
            </a>

        </div>

    </div>

</nav>

<div class="container py-5">

    <div class="text-center mb-5">

        <h1 class="fw-bold">
            Encuentra tu hospedaje ideal
        </h1>

        <p class="text-muted">
            Explora hoteles registrados en destinos turísticos de México
        </p>

    </div>

    <div class="row mb-5 g-3 justify-content-center">

        <div class="col-md-5">

            <input
                type="text"
                id="busquedaHotel"
                class="form-control form-control-lg"
                placeholder="Buscar hotel..."
            >

        </div>

        <div class="col-md-3">

            <select
                id="filtroCategoria"
                class="form-select form-select-lg"
            >

                <option value="">
                    Todas las categorías
                </option>

                <option value="3">
                    3 estrellas
                </option>

                <option value="4">
                    4 estrellas
                </option>

                <option value="5">
                    5 estrellas
                </option>

            </select>

        </div>

    </div>

    <div class="row g-4" id="hotelesContainer">

    </div>

</div>

<script>

async function cargarHoteles(){

    const response =
        await fetch('/api/hoteles');

    const data =
        await response.json();

    console.log(data);

    const container =
        document.getElementById('hotelesContainer');

    container.innerHTML = '';

    const textoBusqueda =
        document
        .getElementById('busquedaHotel')
        .value
        .toLowerCase();

    const categoriaFiltro =
        document
        .getElementById('filtroCategoria')
        .value;

    const hotelesFiltrados =
        data.filter(hotel => {

            const coincideBusqueda =

                hotel.nombre_hospedaje
                .toLowerCase()
                .includes(textoBusqueda);

            const coincideCategoria =

                categoriaFiltro === ''

                ||

                hotel.clasificacion
                .toString()
                .includes(categoriaFiltro);

            return (
                coincideBusqueda &&
                coincideCategoria
            );

        });

    hotelesFiltrados.forEach(hotel => {

        container.innerHTML += `

            <div class="col-md-4">

                <div class="destino-card">

                    <div class="image-container">

                        <img src="images/estados/${hotel.nombre_estado
                        .toLowerCase()
                        .normalize("NFD")
                        .replace(/[\u0300-\u036f]/g, "")
                        .replaceAll(' ','')
                        }.jpg">

                    </div>
                    <div class="destino-info">

                        <h4 class="fw-bold">
                            ${hotel.nombre_hospedaje}
                        </h4>

                        <p class="text-muted mb-2">
                            ${hotel.nombre_destino}
                        </p>

                        <p>
                            Categoría:
                            <strong>
                                ${hotel.nombre_categoria}
                            </strong>
                        </p>

                        <p>
                            ⭐ ${hotel.clasificacion}
                        </p>

                        <p class="text-muted">
                            ${hotel.nombre_estado}
                        </p>

                        <p>
                            Habitaciones:
                            ${hotel.numero_habitaciones}
                        </p>

                        <button class="btn btn-dark w-100">

                            Reservar

                        </button>

                    </div>

                </div>

            </div>

        `;

    });

}

document
.getElementById('busquedaHotel')
.addEventListener(
    'input',
    cargarHoteles
);

document
.getElementById('filtroCategoria')
.addEventListener(
    'change',
    cargarHoteles
);

cargarHoteles();

</script>

</body>
</html>
