<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">

            RUTA MÉXICO

        <div class="navbar-nav mx-auto">

</nav>
<body>

<div class="container mt-5">

    <h1 class="mb-4">Destinos Turísticos</h1>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>Destino</th>
                <th>Tipo</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody id="tablaDestinos"></tbody>
    </table>

</div>

<script>
async function cargarDestinos() {
    const response = await fetch('/api/destinos');
    const data = await response.json();

    const tabla = document.getElementById('tablaDestinos');

    data.forEach(destino => {
        tabla.innerHTML += `
            <tr>
                <td>${destino.nombre_destino}</td>
                <td>${destino.nombre_tipo}</td>
                <td>${destino.nombre_estado}</td>
            </tr>
        `;
    });
}

cargarDestinos();
</script>

</body>
</html>
